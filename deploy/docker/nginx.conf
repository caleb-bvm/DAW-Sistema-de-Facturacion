# Proxy TLS para la configuración productiva (docker-compose.prod.yml).
# Variante contenedorizada de deploy/nginx-facturacion.conf: TLS se termina en
# nginx y el salto a Node es HTTP con X-Forwarded-Proto. El contenedor de la
# app acepta esa cabecera porque la IP de este proxy (172.31.31.20) está en
# TRUSTED_PROXIES.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 250k;

    # Ubicación relativa en las redirecciones: nginx convierte por defecto las
    # rutas relativas en absolutas usando $host sin puerto, con lo que una
    # petición a https://host:8443/ redirigiría a https://host/facturacion/ y
    # se perdería el puerto en todo acceso que no sea el443 estándar.
    absolute_redirect off;

    # La app vive bajo /facturacion/; la raíz redirige en vez de devolver404,
    # igual que ya se hacía con /facturacion sin barra final.
    location = / {
        return 308 /facturacion/;
    }

    location = /facturacion {
        return 308 /facturacion/$is_args$args;
    }

    location /facturacion/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 45s;
    }
}
